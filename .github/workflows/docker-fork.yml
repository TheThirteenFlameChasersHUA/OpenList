name: Docker fork build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -f Dockerfile.fork -t openlist-home-background:ci .

      - name: Smoke test container
        run: |
          set -euo pipefail
          docker run -d --name openlist-ci -p 5244:5244 openlist-home-background:ci
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5244/api/public/settings > /tmp/settings.json; then
              break
            fi
            sleep 2
          done
          grep -q '"home_background"' /tmp/settings.json
          docker logs --tail 100 openlist-ci
          docker rm -f openlist-ci
